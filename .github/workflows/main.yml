name: Check Old PRs and Notify Slack

on:
  schedule:
    - cron: "* * * * *" # Runs every minute for testing purposes; adjust as needed.
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  notify-old-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Watchdog Repository
        uses: actions/checkout@v2
        with:
          repository: akhilesh-s/watchdog # Specify the repository to checkout
          path: watchdog # Clone the repo into the 'watchdog' folder
          OWNER: "akhilesh-s"
          REPO: "notes-nest-client"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          cd watchdog
          npm install

      - name: Execute Script
        run: |
          cd watchdog
          node src/index.js
        env:
          OWNER: "akhilesh-s"
          REPO: "notes-nest-client"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
